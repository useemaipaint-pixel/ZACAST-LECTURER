<style>
:root{--g:#004D2B;--g2:#003B22;--y:#F5C518;--ok:#159447;--bad:#E53945;--bg:#F4F7F5;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;
 --navh:calc(66px + env(safe-area-inset-bottom,0px));--fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Sora","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.01em}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hd{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;margin:0}
.hd-logo{width:54px;height:54px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,77,43,.18))}
.hd-t{display:flex;flex-direction:column;min-width:0;flex:1}
.hd-t b{font-family:var(--fd);font-size:19px;font-weight:800;color:var(--g);letter-spacing:.14em;line-height:1.1}
.hd-t small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hd-r{display:flex;align-items:center;gap:8px;flex:none}
.hd.sub h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:50%;background:#e8eeea;color:#334155;display:flex;align-items:center;justify-content:center}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;font-family:var(--fd);font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #cfe5d8;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.main{flex:1;padding:6px 16px calc(var(--navh) + 40px)}
.wl{font-size:20px;margin:0 0 2px;font-weight:800}
.muted{color:var(--mut);font-size:12px;margin:0 0 14px}
.welcome{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.welcome .avatar{width:56px;height:56px;font-size:22px;border-width:3px}
.welcome .muted{margin:0}
.dbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--g);border-radius:14px;padding:9px 12px;margin:2px 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}

/* ===== Supabase connection ===== */
function readCfg(){
 const c=window.ZACAST_CONFIG||{};let url=(c.SUPABASE_URL||'').trim(),key=(c.SUPABASE_ANON_KEY||'').trim();
 if(!url||!key){try{const s=JSON.parse(sget('zacast_cfg')||'null');if(s&&s.url&&s.key){url=s.url;key=s.key}}catch(e){}}
 return {url:url.replace(/\/+$/,'').replace(/\/rest\/v1$/,''),key:key};
}
const CFG=readCfg();
let token=sget('zacast_token')||'';

function hdr(extra){
 const h={'apikey':CFG.key,'Content-Type':'application/json'};
 if(/^eyJ/.test(CFG.key))h['Authorization']='Bearer '+CFG.key;
 if(token)h['x-admin-token']=token;
 return Object.assign(h,extra||{});
}
async function api(method,path,body,extra){
 let r,t;
 try{
  r=await fetch(CFG.url+'/rest/v1/'+path,{method:method,headers:hdr(extra),body:body===undefined?undefined:JSON.stringify(body)});
  t=await r.text();
 }catch(e){const er=new Error('No internet connection. Please check your network and try again.');er.offline=true;throw er}
 let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){
  const er=new Error((j&&(j.message||j.error_description||j.hint))||('Request failed ('+r.status+')'));
  er.code=j&&j.code;er.status=r.status;throw er;
 }
 return j;
}
async function selectAll(path){
 const out=[],size=1000;let from=0;
 for(;;){
  const d=await api('GET',path+(path.indexOf('?')>-1?'&':'?')+'limit='+size+'&offset='+from)||[];
  for(let i=0;i<d.length;i++)out.push(d[i]);
  if(d.length<size)return out;
  from+=size;
 }
}

let ac=null;
function beep(f,d){if(!soundOn())return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f||660;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.07))}catch(e){}}
function vib(n){try{if(navigator.vibrate)navigator.vibrate(n||15)}catch(e){}}
function toast(msg,err){
 const h=$('#toasts');while(h.childNodes.length>=3)h.removeChild(h.firstChild);
 const el=document.createElement('div');el.className='toast'+(err?' err':'');
 el.innerHTML='<i>'+(err?'!':'✓')+'</i><span></span>';el.lastChild.textContent=msg;
 const kill=()=>{el.classList.remove('in');setTimeout(()=>el.remove(),260)};
 el.onclick=kill;h.appendChild(el);
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
 setTimeout(kill,err?5000:2800);
}
let busyN=0;
function busy(msg){
 if(msg===false){busyN=Math.max(0,busyN-1);if(!busyN)$('#busy').classList.remove('on');return}
 busyN++;$('#busy-t').textContent=msg||'Please wait…';$('#busy').classList.add('on');
}
async function work(msg,fn){busy(msg);try{return await fn()}finally{busy(false)}}
function friendly(e){
 if(!e)return 'Something went wrong';
 if(e.code==='23505')return 'That serial number or admission number is already used in this department.';
 if(/'level' column/.test(e.message||''))return 'Please run supabase_update_levels.sql in Supabase first (see README).';
 if(e.code==='PGRST205'||e.code==='42P01')return 'Database tables not found. Run supabase_setup.sql in Supabase first.';
 return e.message||'Something went wrong';
}
function fail(e){
 if(e&&token&&(e.code==='42501'||e.status===401)){forceLogin();return}
 toast(friendly(e),true);
}

 token='';sdel('zacast_token');stack=[];route={n:'login',p:{}};render();toast('Session expired. Please login again.',true);

  }else{dept=null;db={students:[],sessions:[],rec:{},courses:[]}}
  return true;
 });

  if(token){route={n:'login',p:{}};render()}return;

async function boot(){
 route={n:'splash',p:{}};
 if(!CFG.url||!CFG.key){S.setup();return}
 render();
 const t0=Date.now();
 let me=null,err=null;
 if(token){try{me=await rpc('admin_me')}catch(e){err=e}}
 const wait=Math.max(0,2200-(Date.now()-t0));
 await new Promise(r=>setTimeout(r,wait));
 if(me){setAdmin(me);startApp();return}
 if(err&&err.offline){route={n:'login',p:{}};render();toast(err.message,true);return}
 if(token){token='';sdel('zacast_token')}
 route={n:'login',p:{}};render();
}

async function bulkAdd(){
 const lines=$('#f-bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 if(!lines.length)return toast('Type or paste the students first',true);
 const rows=[],skipped=[];let next=nextSerial();
 const seenAdm={},seenSer={};
 lines.forEach(line=>{
  const parts=line.split(/\t|,/).map(x=>x.trim()).filter((x,i,a)=>!(x===''&&a.length>1));
  let ser=null,name,adm;
  if(parts.length>=3&&/^\d+$/.test(parts[0])){ser=parseInt(parts[0],10);name=parts[1];adm=parts[2]}
  else{name=parts[0];adm=parts[1]}
  name=cleanName(name).toUpperCase();
  if(!name||!adm){skipped.push(line+' (missing name or admission number)');return}
  const ak=String(adm).toLowerCase();
  if(admTaken(adm)||seenAdm[ak]){skipped.push(name+' ('+adm+' already exists)');return}
  if(ser==null||serialTaken(ser)||seenSer[ser]){while(serialTaken(next)||seenSer[next])next++;ser=next}
  seenAdm[ak]=1;seenSer[ser]=1;
  rows.push({department_id:dept.id,serial:ser,name:name,adm_no:adm});
 });
 if(!rows.length)return toast('Nothing added. '+(skipped[0]||''),true);
 const out=await act('Adding '+rows.length+' students…',async()=>{
  const res=[];for(let i=0;i<rows.length;i+=200){const part=await api('POST','students',rows.slice(i,i+200),{Prefer:'return=representation'});res.push.apply(res,part)}return res;
 });
 if(!out)return;
 out.forEach(r=>db.students.push(mapStu(r)));beep(784);
 if(!skipped.length){toast(out.length+' students added');back();return}
 toast(out.length+' added, '+skipped.length+' skipped. First skipped: '+skipped[0],true);
 $('#f-bulk').value=skipped.join('\n').replace(/ \(.*\)$/gm,'');
}

}

   im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
    x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(im,sx,sy,s,s,0,0,size,size);res(c.toDataURL('image/jpeg',.86))};
   im.onerror=rej;im.src=fr.result};

 });

  const c=aiCourse(t);
  if(c){AIH.pending=null;return aiMark(p.status,c)}
  return aiSay('bot','I did not find that course. Type one of: <b>'+sortedCourses().map(x=>esc(x.code)).join(', ')+'</b> (or “cancel”).');
 }
 const all=has(/ (all|every|everyone|duka|dukka|dukkan|kowa) /),stu=has(/ (student|students|dalibai|dalibi|dalibin|almajirai) /);
 const present=has(/ (present|halarci|sun halarci|ya halarci|sun zo|ya zo|yazo) /),absent=has(/ (absent|bai zo|basu zo|ba su zo|rashin zuwa|ba sa nan) /);
 if(has(/ (help|taimako|taimaka|me zaka iya|abin da zaka iya) /))return aiSay('bot',AI_HELP);
 if(has(/ (hello|hi|hey|sannu|barka|ina kwana|ina wuni) /)&&t.trim().split(' ').length<4)return aiSay('bot','Hello! What can I help you with?');
 // delete all students
 if(has(/ (delete|remove|clear|erase|goge|share|cire) /)&&all&&stu){
  const g=aiTarget(t);if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  if(!db.students.length)return aiSay('bot','There are no students in <b>'+esc(dept.name)+'</b>.');
  aiSay('bot','Please confirm: delete all <b>'+db.students.length+'</b> students of <b>'+esc(dept.name)+'</b>. Type DELETE in the box that opened.');
  return formatAll();
 }
 // mark all present / absent
 if((present||absent)&&all){
  const status=absent&&!present?'absent':'present',g=aiTarget(t);
  if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  if(!db.students.length)return aiSay('bot','There are no students in <b>'+esc(dept.name)+'</b>.');
  if(!coursesOK||!db.courses.length)return aiSay('bot','<b>'+esc(dept.name)+'</b> has no course yet. Add a course first (Settings → Courses).');
  const c=aiCourse(t);
  if(!c){AIH.pending={status:status};return aiSay('bot','Which course? Type one of: <b>'+sortedCourses().map(x=>esc(x.code)).join(', ')+'</b>')}
  return aiMark(status,c);
 }
 // add student
 const am=raw.match(/(?:add|register|kara|ƙara|saka)\s+(?:a\s+|new\s+|sabon\s+)?(?:student|dalibi|ɗalibi)\s*:?\s*(.+?)\s*[,;]\s*(\S+?)(?:\s+(?:to|in|a|cikin|zuwa)\s+.*)?$/i);
 if(am){
  const g=aiTarget(t);if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  const name=cleanName(am[1]).toUpperCase(),adm=am[2].trim();
  if(admTaken(adm))return aiSay('bot','Admission number <b>'+esc(adm)+'</b> is already registered in '+esc(dept.name)+'.');
  const r=await act('Saving…',()=>api('POST','students',[{department_id:dept.id,serial:nextSerial(),name:name,adm_no:adm}],{Prefer:'return=representation'}));
  if(!r)return aiSay('bot','Could not add the student.');
  db.students.push(mapStu(r[0]));beep(784);
  return aiSay('bot','✓ Added <b>'+esc(name)+'</b> ('+esc(adm)+') to <b>'+esc(dept.name)+'</b>.');
 }
 // export
 if(has(/ (export|download|print|fitar|sauke|fito|buga) /)){
  const g=aiTarget(t);if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  const kind=has(/ (excel|csv|sheet) /)?'csv':'pdf',sum=has(/ (summary|report|rahoto|sakamako) /);
  if(!db.students.length)return aiSay('bot','There are no students in <b>'+esc(dept.name)+'</b> to export.');
  if(sum)view.course='all';
  aiSay('bot','Preparing the '+(sum?'attendance summary':'student list')+' of <b>'+esc(dept.name)+'</b> as '+(kind==='pdf'?'PDF (choose “Save as PDF” in the print window)':'Excel (CSV)')+'…');
  return doExport(kind,sum?repSummary():repStudents());
 }
 // count
 if(has(/ (how many|count|number of|nawa|yawan|total) /)){
  const g=aiTarget(t);if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  return aiSay('bot','<b>'+esc(dept.name)+'</b> has <b>'+db.students.length+'</b> student(s).');
 }
 // open page / switch department
 const pages={dashboard:'dashboard',students:'students',attendance:'attendance',reports:'reports',report:'reports',settings:'settings'};
 if(has(/ (open|go to|goto|take me|bude|je|koma|switch) /)){
  for(const k in pages){if(t.indexOf(' '+k+' ')>-1){setTimeout(()=>tab(pages[k]),250);return aiSay('bot','Opening '+k+'…')}}
  if(t.indexOf(' courses ')>-1){setTimeout(()=>nav('courses'),250);return aiSay('bot','Opening courses…')}
  const g=aiTarget(t);
  if(g.explicit&&g.d){if(!await aiUse(g.d))return;return aiSay('bot','✓ Now working in <b>'+esc(dept.name)+'</b> ('+db.students.length+' students).')}
 }
 // find / list students
 const q=t.trim().split(' ').filter(w=>w&&AI_STOP.indexOf(w)<0&&!(aiBase(t)&&aiNorm(aiBase(t)).indexOf(' '+w+' ')>-1)).join(' ');
 const finder=has(/ (find|search|show|list|display|look|get|nemo|nema|nuna|bincika|duba) /);
 if(finder||stu||(q&&q.split(' ').length<=4)){
  const g=aiTarget(t);if(!g.d)return aiSay('bot','I could not find that department or level.');
  if(!await aiUse(g.d))return;
  const l=sortedStudents().filter(s=>matches(s,q));
  if(!l.length)return aiSay('bot','No student found'+(q?' for “'+esc(q)+'”':'')+' in <b>'+esc(dept.name)+'</b>.');
  return aiSay('bot','Found <b>'+l.length+'</b> student(s) in <b>'+esc(dept.name)+'</b>'+(q?' for “'+esc(q)+'”':'')+':'+l.slice(0,15).map(s=>stuRow(s)).join('')+(l.length>15?'<div class="muted" style="margin:8px 0 0">…and '+(l.length-15)+' more. Type a name to narrow down.</div>':''));
 }
 aiSay('bot','Sorry, I did not understand that. Type <b>Help</b> to see what I can do.');
}
async function aiMark(status,c){
 const n=db.students.length;
 confirmBox({title:'Mark all '+status+'?',text:'All '+n+' students of '+dept.name+' will be marked '+status+' for '+courseLabel(c)+' today. Continue?',ok:'Yes, mark all',onOk:async()=>{
  closeModal();
  const s=await act('Marking…',async()=>{
   let x=db.sessions.find(y=>y.courseId===c.id&&y.date===todayStr()&&y.status!=='Completed');
   if(!x){const r=await api('POST','attendance_sessions',[{department_id:dept.id,course:courseLabel(c),course_id:c.id,semester:SEMS[0],date:todayStr(),time:nowTime(),day:dayOf(todayStr())}],{Prefer:'return=representation'});x=mapSes(r[0]);db.sessions.push(x)}
   const m=db.rec[x.id]||(db.rec[x.id]={});
   await upsertRecs(db.students.map(st=>{m[st.id]=status;return {department_id:dept.id,session_id:x.id,student_id:st.id,status:status}}));
   return x;
  });
  if(!s)return aiSay('bot','Nothing was changed.');
  beep(784);aiSay('bot','✓ All <b>'+n+'</b> students of <b>'+esc(dept.name)+'</b> marked <b>'+status+'</b> for '+esc(courseLabel(c))+'.<br><button class="lnk" data-act="session" data-id="'+s.id+'">Open this attendance</button>');
 }});
}

  token='';sdel('zacast_token');stack=[];route={n:'login',p:{}};render();
 }}),

 },

 'rm-photo':()=>{pendingAvatar='';if(view.repaintPhoto)view.repaintPhoto();toast('Photo will be removed. Tap Save Changes.')},
 'save-profile':async()=>{
  const n=cleanName($('#a-name').value),u=$('#a-user').value.trim();
  if(!n)return toast('Full name is required',true);
  if(u.length<3||/\s/.test(u))return toast('Username must be at least 3 characters with no spaces',true);
  const r=await act('Saving profile…',()=>rpc('admin_update_profile',{p_full_name:n,p_username:u,p_avatar:pendingAvatar}));
  if(!r)return;
  setAdmin(r);sset('zacast_lastuser',u);toast('Profile updated');beep(784);back();
 },
 'save-pw':async()=>{
  const a=$('#pw0').value,b=$('#pw1').value,c=$('#pw2').value;
  if(!a)return toast('Enter your current password',true);
  if(b.length<6)return toast('New password must be at least 6 characters',true);
  if(b!==c)return toast('New passwords do not match',true);
  const r=await act('Updating…',()=>rpc('admin_change_password',{p_old:a,p_new:b}));
  if(!r)return;
  if(!r.ok)return toast(r.error||'Could not change password',true);
  toast('Password updated successfully');back();
 },
 'do-backup':async()=>{
  const r=await act('Preparing backup…',()=>Promise.all([
   selectAll('departments?select=*&order=created_at.asc'),selectAll('students?select=*&order=department_id.asc,serial.asc'),
   selectAll('attendance_sessions?select=*&order=created_at.asc'),selectAll('attendance_records?select=*&order=id.asc'),selectAll('courses?select=*&order=created_at.asc').catch(()=>[])]));
  if(!r)return;
  const data={app:'ZACAST',version:3,exportedAt:new Date().toISOString(),departments:r[0],students:r[1],sessions:r[2],records:r[3],courses:r[4]};
  downloadBlob('ZACAST_Backup_'+todayStr()+'.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  toast('Backup file downloaded');
 }
};

/* ===== Keyboard fix: keep the field you are typing in visible ===== */
(function(){
 const vv=window.visualViewport;
 const touch=()=>{try{return window.matchMedia('(pointer:coarse)').matches}catch(e){return false}};
 const isField=el=>!!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!/^(checkbox|radio|file|button|submit|hidden)$/.test(el.type||'');
 function reveal(){
  const el=document.activeElement;if(!isField(el)||!el.scrollIntoView)return;
  try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){try{el.scrollIntoView()}catch(e2){}}
 }
 function fitModal(){
  const ov=document.querySelector('#modal-root .ov');if(!ov||!vv)return;
  const mb=ov.firstChild,open=document.body.classList.contains('kb');
  if(open){ov.style.top=vv.offsetTop+'px';ov.style.bottom='auto';ov.style.height=vv.height+'px';if(mb&&mb.style)mb.style.maxHeight=Math.max(vv.height-24,160)+'px'}
  else{ov.style.top='';ov.style.bottom='';ov.style.height='';if(mb&&mb.style)mb.style.maxHeight=''}
 }
 document.addEventListener('focusin',e=>{
  if(!isField(e.target))return;
  if(touch())document.body.classList.add('kb');
  fitModal();[60,320,650].forEach(ms=>setTimeout(reveal,ms));
 });
 document.addEventListener('focusout',()=>{
  setTimeout(()=>{if(!isField(document.activeElement)){document.body.classList.remove('kb');fitModal()}},200);
 });
 if(vv){vv.addEventListener('resize',()=>{fitModal();reveal()});vv.addEventListener('scroll',fitModal)}
})();

window.__zacast={get state(){return {dept:dept,depts:depts,db:db,admin:admin}}};
boot();
})();
